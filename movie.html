body {
    margin: 0;

    color: white;
}

.back {
    position: fixed;
    top: 15px;
    left: 15px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 8px;
    backdrop-filter: blur(5px);
    z-index: 10;
}

.player-container {
    max-width: 1000px;
    margin: 70px auto;
    text-align: center;
    padding: 15px;
}

#title {
    margin-bottom: 15px;
    font-size: 22px;
}

.video-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 12px;
    overflow: hidden;
}

iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.loader {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    z-index: 2;
}
</style>
</head>
