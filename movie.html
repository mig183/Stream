/* BOTÓN VOLVER */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 8px;
    backdrop-filter: blur(5px);
    transition: 0.3s;
}

.back:hover {
    background: rgba(255,255,255,0.3);
}

/* CONTENEDOR */
.player-container {
    max-width: 1000px;
    margin: 80px auto;
    text-align: center;
    padding: 20px;
}

/* TÍTULO */
#title {
    margin-bottom: 20px;
    font-size: 28px;
}

/* VIDEO */
.video-box {
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

/* IFRAME */
iframe {
    width: 100%;
    height: 500px;
    border: none;
}

/* LOADER */
.loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

/* RESPONSIVE */
@media(max-width: 768px){
    iframe {
        height: 250px;
    }
}
</style>
</head>
